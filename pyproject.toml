[project]
name = "cost-engine"
version = "0.1.0"
description = "NYC building cost-estimation engine (v0). LLMs parse in; deterministic code produces every number."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "requests>=2.32",
    "pydantic>=2.9",
    "pypdf>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
